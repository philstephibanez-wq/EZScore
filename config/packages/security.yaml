security:
    role_hierarchy:
        ROLE_EDITOR: ROLE_READER
        ROLE_ADMIN: ROLE_EDITOR

    password_hashers:
        App\Domain\User\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_catalog
                always_use_default_target_path: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                always_remember_me: false
            logout:
                path: app_logout
                target: /

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(fr|en)/?$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/assets/, roles: PUBLIC_ACCESS }
        - { path: ^/locale/, roles: PUBLIC_ACCESS }
        # R38.14b public contact
        - { path: ^/contact-public$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/(fr|en)/contact-public$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/connect/google/check$, roles: PUBLIC_ACCESS }
        - { path: ^/(fr|en)/catalog$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/(fr|en)/song/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/(fr|en)/(first-run|login|register|registration/pending|activation/resend|activate/|connect/google), roles: PUBLIC_ACCESS }
        - { path: ^/(fr|en)/admin, roles: ROLE_ADMIN }
        - { path: ^/(fr|en)/, roles: ROLE_USER }
