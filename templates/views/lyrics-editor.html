<div class="ez-editor-shell">
  <div class="ez-editor-help">
    <span>
      Double-clic = modifier · clic long sur un mot = insérer ↵ ·
      clic gauche maintenu + glisser = déplacer.
    </span>
    <label class="ez-meter-control" title="Signature de présentation">
      <span>Signature</span>
      <input class="ez-meter-input" type="text" inputmode="numeric"
             maxlength="5" spellcheck="false" aria-label="Signature rythmique">
      <span class="ez-meter-source"></span>
    </label>
  </div>

  <div class="ez-editor-window">
    <div class="ez-fixed-playhead" title="Position de lecture visuelle"></div>

    <div class="ez-editor-viewport">
      <div class="ez-editor-canvas">
        <div class="ez-row">
          <div class="ez-row-label">Sections</div>
          <div class="ez-track ez-sections"></div>
        </div>

        <div class="ez-row">
          <div class="ez-row-label">Accords</div>
          <div class="ez-track ez-chords"></div>
        </div>

        <div class="ez-row">
          <div class="ez-row-label">Chant</div>
          <div class="ez-track ez-lead"></div>
        </div>

        <div class="ez-row">
          <div class="ez-row-label">Chœurs</div>
          <div class="ez-track ez-backing"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="ez-editor-footer">
    <span class="ez-position">0:00</span>
    <span>← une seule timeline / une seule scrollbar →</span>
  </div>
</div>
