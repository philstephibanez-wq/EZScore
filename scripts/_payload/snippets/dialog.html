
<dialog class="ez-modal chord-reset-dialog" data-chord-reset-dialog>
    <div class="ez-modal-card">
        <h3>Réinitialiser les accords ?</h3>
        <p>Les corrections manuelles seront supprimées et les accords issus de la dernière analyse seront restaurés.</p>
        <div class="ez-modal-actions">
            <button type="button" data-chord-reset-cancel>Annuler</button>
            <button type="button" class="danger" data-chord-reset-confirm>Réinitialiser</button>
        </div>
    </div>
</dialog>
