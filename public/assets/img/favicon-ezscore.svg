<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">EZScore favicon</title>
  <desc id="desc">Dark rounded-square icon combining a stylized guitar, chord grid, play symbol, and EZ monogram.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17384d"/>
      <stop offset="0.55" stop-color="#0b1b27"/>
      <stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ffb23f"/>
      <stop offset="1" stop-color="#f27a1a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="46" fill="url(#bg)"/>

  <!-- Guitar silhouette -->
  <path d="M73 43
           C50 62 44 87 50 112
           C56 137 42 163 31 184
           C49 177 63 163 74 146
           C88 125 92 103 86 83
           C82 69 86 57 98 46
           Z"
        fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>

  <!-- Guitar neck / strings -->
  <line x1="111" y1="24" x2="111" y2="150" stroke="#d8edf8" stroke-width="4"/>
  <line x1="120" y1="24" x2="120" y2="150" stroke="#d8edf8" stroke-width="3"/>
  <line x1="129" y1="24" x2="129" y2="150" stroke="#d8edf8" stroke-width="3"/>
  <line x1="138" y1="24" x2="138" y2="150" stroke="#d8edf8" stroke-width="4"/>

  <!-- Sound hole -->
  <circle cx="124" cy="105" r="28" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- Chord grid -->
  <g transform="translate(150 56)" stroke="#d7e9f0" stroke-width="3" fill="none" opacity=".96">
    <rect x="0" y="0" width="70" height="62" rx="5"/>
    <line x1="17.5" y1="0" x2="17.5" y2="62"/>
    <line x1="35" y1="0" x2="35" y2="62"/>
    <line x1="52.5" y1="0" x2="52.5" y2="62"/>
    <line x1="0" y1="15.5" x2="70" y2="15.5"/>
    <line x1="0" y1="31" x2="70" y2="31"/>
    <line x1="0" y1="46.5" x2="70" y2="46.5"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="168" cy="87" r="6"/>
    <circle cx="185" cy="87" r="6"/>
    <circle cx="203" cy="103" r="6"/>
  </g>

  <!-- Play button -->
  <g filter="url(#shadow)">
    <circle cx="136" cy="151" r="34" fill="#0e2736" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M126 132 L126 170 L157 151 Z" fill="#ffffff"/>
  </g>

  <!-- Musical note -->
  <g fill="url(#gold)">
    <path d="M197 137 v39 c-5-3-13-2-18 2-6 5-7 12-2 16 5 5 14 4 20-1 4-4 6-8 6-13v-30l27-7v25c-5-3-13-2-18 2-6 5-7 12-2 16 5 5 14 4 20-1 4-4 6-8 6-13v-47z"/>
  </g>

  <!-- EZ monogram -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="900" fill="#ffffff">
    <text x="50" y="221" font-size="47" letter-spacing="-3">EZ</text>
  </g>
</svg>
